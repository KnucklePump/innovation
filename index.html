<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Innovation — Idea Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4GBEW1448T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-4GBEW1448T');
  </script>
</head>
<body>
  <!-- Password gate (casual, client-side — hides the UI, not the data) -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card">
      <h1>Innovation</h1>
      <p class="muted">Private idea board. Enter the group password.</p>
      <input id="gate-input" type="password" placeholder="Password" autocomplete="current-password" autofocus />
      <button type="submit">Enter</button>
      <p id="gate-error" class="gate-error" hidden>Incorrect password.</p>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#/" class="brand"><span class="wm-accent">I</span>nnovation</a>
        <span class="brand-sub" id="brand-sub"></span>
        <nav class="nav-actions">
          <select id="voter-pick" class="voter-pick" title="Who are you? (for voting)"></select>
          <a href="#/submit" class="pill-link">+ Submit idea</a>
          <button id="signout" class="ghost" title="Sign out">Sign out</button>
        </nav>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
